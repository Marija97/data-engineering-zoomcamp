# Assignment:  Build a Kestra workflow from scratch that downloads 
#              NYC Taxi Trip Data and loads it into PostgreSQL
id: 04_postgres_taxi_from_scratch
namespace: zoomcamp.masha
description: 
  Extract Yellow and Green Taxi trip data partitioned by year and 
  month, load each monthly dataset into a PostgreSQL staging table, 
  and merge the data into the corresponding final destination table.


# CSV data source: https://github.com/DataTalksClub/nyc-tlc-data/releases
# The workflow should support both Yellow Taxi and Green Taxi data and allow 
# the user to select the taxi type, year, and month when starting the flow.

# Build the input filename dynamically
# For example: yellow_tripdata_2019-01.csv or green_tripdata_2020-05.csv
# So we need inputs - dynamic values that are selected when starting the flow

# =============================================================================
# Input parameters
# =============================================================================
inputs:

  # Select between Yellow Taxi and Green Taxi data
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: yellow

  # Select the year of the taxi data
  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020"]
    defaults: "2020"

  # Select the month of the taxi data
  - id: month
    type: SELECT
    displayName: Select month
    values: ["01", "02", "03", "04", "05", "06",
             "07", "08", "09", "10", "11", "12"]
    defaults: "04"


# =============================================================================
# Common values as variables
# =============================================================================
# Variables are key-value pairs that let you reuse values across tasks in 
# a flow, or across multiple flows when stored at the namespace level.
# Their value is read with: {{render(vars.variable_name)}}
variables:
  
  # Name of the file to be downloaded as data source
  # Example: yellow + 2019 + 01 --> yellow_tripdata_2019-01.csv
  filename: "{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}.csv"

  # Construct the URL source dynamically for the selected data file
  # Example:     "https://github.com/DataTalksClub/nyc-tlc-data/releases/download/yellow/yellow_tripdata_2019-01.csv.gz"
  data_src_link: "https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi}}/{{vars.filename}}.gz"

  # Temporary table used while loading the CSV
  # Example: public.yellow_tripdata_staging
  staging_table: "public.{{inputs.taxi}}_tripdata_staging"

  # Final destination table
  # Example: public.yellow_tripdata
  table: "public.{{inputs.taxi}}_tripdata"

  # Reference to the CSV file produced by the extract task
  # The extract task stores its generated files in outputFiles
  # Select the file whose name is defined by the filename variable
  data: "{{outputs.extract.outputFiles[render(vars.filename)]}}"

# =============================================================================
# PostgreSQL connection setup
# =============================================================================
# Define the pluginDefaults to avoid repeating the 
# connection details in every PostgreSQL task
pluginDefaults:
  - type: io.kestra.plugin.jdbc.postgresql
    values:
      url: jdbc:postgresql://pgdatabase:5432/ny_taxi
      username: root
      password: root


# =============================================================================
# Tasks
# =============================================================================
tasks:
    # -------------------------------------------------------------------------
    # Set labels
    # -------------------------------------------------------------------------
    # Add metadata/labels to the Kestra execution to make
    # executions easier to identify in the Kestra UI
    - id: set_labels
      type: io.kestra.plugin.core.execution.Labels
      labels:
        file: "{{render(vars.file)}}"
        taxi: "{{inputs.taxi}}"
   
    # -------------------------------------------------------------------------
    # Prepare data URL
    # -------------------------------------------------------------------------
    # Show the URL source for the selected data file to download
    - id: prepare_data_source
      type: io.kestra.plugin.core.log.Log
      message: "Preparing data source link: {{render(vars.data_src_link)}}"


    # -------------------------------------------------------------------------
    # Extract / Download data
    # -------------------------------------------------------------------------
    # Create a task that downloads the selected .csv.gz file 
    # from the repository and decompresses it into a CSV file
    - id: extract

      # The task for running shell commands such as wget ... | gunzip ...
      type: io.kestra.plugin.scripts.shell.Commands

      # Tell Kestra that any CSV created by this task should be captured as
      # task outputs to make them available for other tasks via outputs._
      outputFiles:
        - "*.csv"

      # Execute the shell command directly as a process.
      # taskRunner specifies where/how Kestra should execute the task.
      # Process: The command runs as a process in the execution environment
      # rather than, for example, being sent to a Docker container.
      taskRunner:
        type: io.kestra.plugin.core.runner.Process

      commands:
        # The shell commands to be executed
        # wget downloads the file compressed as .gz. and gunzip decompresses it
        # and the result gets written in the file with the name defined in variables
        - wget -qO- {{render(vars.data_src_link)}} | gunzip | head -n 10 > {{render(vars.filename)}} 
          

    # =========================================================================
    # YELLOW TAXI PIPELINE
    # =========================================================================
    # Execute this branch only when taxi = yellow
    #
    - id: if_yellow_taxi
      type: io.kestra.plugin.core.flow.If

      condition: "{{inputs.taxi == 'yellow'}}"

      then:

      # -----------------------------------------------------------------------
      # Create the final table
      # -----------------------------------------------------------------------
      # Connect to the database and
      # create the final PostgreSQL table if it doesn't exist.
      #
      # This is where the processed taxi data will ultimately be stored.
      - id: yellow_create_table
        type: io.kestra.plugin.jdbc.postgresql.Query

        # Data documentation for Yellow Taxi Trip Records: 
        # https://www.nyc.gov/assets/tlc/downloads/pdf/data_dictionary_trip_records_yellow.pdf
        sql: |
          CREATE TABLE IF NOT EXISTS {{render(vars.table)}} (
              unique_row_id          text,
              filename               text,
              VendorID               text,
              tpep_pickup_datetime   timestamp,
              tpep_dropoff_datetime  timestamp,
              passenger_count        integer,
              trip_distance          double precision,
              RatecodeID             text,
              store_and_fwd_flag     text,
              PULocationID           text,
              DOLocationID           text,
              payment_type           integer,
              fare_amount            double precision,
              extra                  double precision,
              mta_tax                double precision,
              tip_amount             double precision,
              tolls_amount           double precision,
              improvement_surcharge  double precision,
              total_amount           double precision,
              congestion_surcharge   double precision
          );
        
      # -----------------------------------------------------------------------
      # Create the staging table
      # -----------------------------------------------------------------------
      # The staging table is a temporary/intermediate location.
      #
      # In order to ensure idempotency, 
      # the data is first loaded here before being merged into the final table.
      - id: yellow_create_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          CREATE TABLE IF NOT EXISTS {{render(vars.staging_table)}} (
              unique_row_id          text,
              filename               text,
              VendorID               text,
              tpep_pickup_datetime   timestamp,
              tpep_dropoff_datetime  timestamp,
              passenger_count        integer,
              trip_distance          double precision,
              RatecodeID             text,
              store_and_fwd_flag     text,
              PULocationID           text,
              DOLocationID           text,
              payment_type           integer,
              fare_amount            double precision,
              extra                  double precision,
              mta_tax                double precision,
              tip_amount             double precision,
              tolls_amount           double precision,
              improvement_surcharge  double precision,
              total_amount           double precision,
              congestion_surcharge   double precision
          );

      # -----------------------------------------------------------------------
      # Empty the staging table
      # -----------------------------------------------------------------------
      # Potentially the staging table had existed before the prevous step and
      # consists of some data from a previous execution.
      # Remove that data before loading the new CSV.
      - id: yellow_clear_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          TRUNCATE TABLE {{render(vars.staging_table)}};

      # -----------------------------------------------------------------------
      # Load the extracted data into the staging table
      # -----------------------------------------------------------------------
      - id: yellow_insert_data_into_staging_table
        type: io.kestra.plugin.jdbc.postgresql.CopyIn
        format: CSV
        from: "{{render(vars.data)}}"
        table: "{{render(vars.staging_table)}}"
        # Explicitly define the order of columns in the CSV
        columns: [VendorID, tpep_pickup_datetime, tpep_dropoff_datetime,
        passenger_count, trip_distance,RatecodeID, store_and_fwd_flag, 
        PULocationID, DOLocationID, payment_type, fare_amount, extra, 
        mta_tax,tip_amount, tolls_amount, improvement_surcharge, total_amount, 
        congestion_surcharge]
        header: true # CSV contains a header row

      # -----------------------------------------------------------------------
      # Update staging table with unique row id for each record
      # -----------------------------------------------------------------------
      #
      # A set of identifying columns are are concatenated together and passed
      # through MD5 function that generates a hash that will identify the row.
      #
      - id: yellow_add_unique_row_id
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          UPDATE {{render(vars.staging_table)}}
          SET

            unique_row_id = md5(
              COALESCE(CAST(VendorID AS text), '') ||
              COALESCE(CAST(tpep_pickup_datetime AS text), '') ||
              COALESCE(CAST(tpep_dropoff_datetime AS text), '') ||
              COALESCE(PULocationID, '') ||
              COALESCE(DOLocationID, '') ||
              COALESCE(CAST(fare_amount AS text), '') ||
              COALESCE(CAST(trip_distance AS text), '')
            ),

            filename = '{{render(vars.filename)}}';
      
      # -----------------------------------------------------------------------
      # Merge into the final table using the staging table
      # -----------------------------------------------------------------------
      # Compare rows in the staging table with rows already
      # present in the final table. Insert only the rows that do not already exist
      #
      # This prevents duplicate rows when the same data is loaded again.
      #
      - id: yellow_insert_into_the_final_table
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          MERGE INTO {{render(vars.table)}} AS T
          USING {{render(vars.staging_table)}} AS S

          ON T.unique_row_id = S.unique_row_id

          WHEN NOT MATCHED THEN
            INSERT (
              unique_row_id,
              filename,
              VendorID,
              tpep_pickup_datetime,
              tpep_dropoff_datetime,
              passenger_count,
              trip_distance,
              RatecodeID,
              store_and_fwd_flag,
              PULocationID,
              DOLocationID,
              payment_type,
              fare_amount,
              extra,
              mta_tax,
              tip_amount,
              tolls_amount,
              improvement_surcharge,
              total_amount,
              congestion_surcharge
            )

            VALUES (
              S.unique_row_id,
              S.filename,
              S.VendorID,
              S.tpep_pickup_datetime,
              S.tpep_dropoff_datetime,
              S.passenger_count,
              S.trip_distance,
              S.RatecodeID,
              S.store_and_fwd_flag,
              S.PULocationID,
              S.DOLocationID,
              S.payment_type,
              S.fare_amount,
              S.extra,
              S.mta_tax,
              S.tip_amount,
              S.tolls_amount,
              S.improvement_surcharge,
              S.total_amount,
              S.congestion_surcharge
            );

      
    # =========================================================================
    # GREEN TAXI PIPELINE
    # =========================================================================
    # Execute this branch only when taxi = green
    #
    # The logic is the same as to the yellow branch, 
    # except for the green taxi data having a different schema.
    - id: if_green_taxi
      type: io.kestra.plugin.core.flow.If

      condition: "{{inputs.taxi == 'green'}}"

      then:

      # -----------------------------------------------------------------------
      # Create the final table
      # -----------------------------------------------------------------------
      # Connect to the database and
      # create the final PostgreSQL table if it doesn't exist.
      #
      # This is where the processed taxi data will ultimately be stored.
      - id: green_create_table
        type: io.kestra.plugin.jdbc.postgresql.Query

        sql: |
          CREATE TABLE IF NOT EXISTS {{render(vars.table)}} (
              unique_row_id          text,
              filename               text,
              VendorID               text,
              lpep_pickup_datetime   timestamp,
              lpep_dropoff_datetime  timestamp,
              store_and_fwd_flag     text,
              RatecodeID             text,
              PULocationID           text,
              DOLocationID           text,
              passenger_count        integer,
              trip_distance          double precision,
              fare_amount            double precision,
              extra                  double precision,
              mta_tax                double precision,
              tip_amount             double precision,
              tolls_amount           double precision,
              ehail_fee              double precision,
              improvement_surcharge  double precision,
              total_amount           double precision,
              payment_type           integer,
              trip_type              integer,
              congestion_surcharge   double precision
          );
        
      # -----------------------------------------------------------------------
      # Create the staging table
      # -----------------------------------------------------------------------
      - id: green_create_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          CREATE TABLE IF NOT EXISTS {{render(vars.staging_table)}} (
              unique_row_id          text,
              filename               text,
              VendorID               text,
              lpep_pickup_datetime   timestamp,
              lpep_dropoff_datetime  timestamp,
              store_and_fwd_flag     text,
              RatecodeID             text,
              PULocationID           text,
              DOLocationID           text,
              passenger_count        integer,
              trip_distance          double precision,
              fare_amount            double precision,
              extra                  double precision,
              mta_tax                double precision,
              tip_amount             double precision,
              tolls_amount           double precision,
              ehail_fee              double precision,
              improvement_surcharge  double precision,
              total_amount           double precision,
              payment_type           integer,
              trip_type              integer,
              congestion_surcharge   double precision
          );

      # -----------------------------------------------------------------------
      # Empty the staging table
      # -----------------------------------------------------------------------
      - id: green_clear_staging_table
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          TRUNCATE TABLE {{render(vars.staging_table)}};

      # -----------------------------------------------------------------------
      # Load the extracted data into the staging table
      # -----------------------------------------------------------------------
      - id: green_insert_data_into_staging_table
        type: io.kestra.plugin.jdbc.postgresql.CopyIn
        format: CSV
        from: "{{render(vars.data)}}"
        table: "{{render(vars.staging_table)}}"
        # Explicitly define the order of columns in the CSV
        columns: [VendorID, lpep_pickup_datetime, lpep_dropoff_datetime, store_and_fwd_flag, 
        RatecodeID, PULocationID, DOLocationID, passenger_count, trip_distance, 
        fare_amount, extra, mta_tax, tip_amount, tolls_amount, ehail_fee, 
        improvement_surcharge, total_amount, payment_type, trip_type, 
        congestion_surcharge]
        header: true # CSV contains a header row

      # -----------------------------------------------------------------------
      # Update staging table with unique row id for each record
      # -----------------------------------------------------------------------
      #
      - id: green_add_unique_row_id
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          UPDATE {{render(vars.staging_table)}}
          SET

            unique_row_id = md5(
              COALESCE(CAST(VendorID AS text), '') ||
              COALESCE(CAST(lpep_pickup_datetime AS text), '') ||
              COALESCE(CAST(lpep_dropoff_datetime AS text), '') ||
              COALESCE(PULocationID, '') ||
              COALESCE(DOLocationID, '') ||
              COALESCE(CAST(fare_amount AS text), '') ||
              COALESCE(CAST(trip_distance AS text), '')
            ),

            filename = '{{render(vars.filename)}}';
    
      
      # -----------------------------------------------------------------------
      # Merge into the final table using the staging table
      # -----------------------------------------------------------------------
      - id: green_insert_into_the_final_table
        type: io.kestra.plugin.jdbc.postgresql.Queries

        sql: |
          MERGE INTO {{render(vars.table)}} AS T
          USING {{render(vars.staging_table)}} AS S

          ON T.unique_row_id = S.unique_row_id

          WHEN NOT MATCHED THEN
            INSERT (
              unique_row_id,
              filename,
              VendorID,
              lpep_pickup_datetime,
              lpep_dropoff_datetime,
              store_and_fwd_flag,
              RatecodeID,
              PULocationID,
              DOLocationID,
              passenger_count,
              trip_distance,
              fare_amount,
              extra,
              mta_tax,
              tip_amount,
              tolls_amount,
              ehail_fee,
              improvement_surcharge,
              total_amount,
              payment_type,
              trip_type,
              congestion_surcharge
            )

            VALUES (
              S.unique_row_id,
              S.filename,
              S.VendorID,
              S.lpep_pickup_datetime,
              S.lpep_dropoff_datetime,
              S.store_and_fwd_flag,
              S.RatecodeID,
              S.PULocationID,
              S.DOLocationID,
              S.passenger_count,
              S.trip_distance,
              S.fare_amount,
              S.extra,
              S.mta_tax,
              S.tip_amount,
              S.tolls_amount,
              S.ehail_fee,
              S.improvement_surcharge,
              S.total_amount,
              S.payment_type,
              S.trip_type,
              S.congestion_surcharge
            );


    # =========================================================================
    # Clean up execution files
    # =========================================================================
    # Delete files created during this execution.
    #
    # If you'd like to explore Kestra outputs, disable this step.
    - id: purge_files
      type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
